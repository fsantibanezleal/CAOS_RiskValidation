<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" width="1040" height="410" role="img" aria-labelledby="t d">
  <title id="t">Published simulation studies reproduced by the harness</title>
  <desc id="d">Each published rejection rate against the harness's rate on the same design: BCBS WP14 Tables 7 and 8 (normal and traffic-lights tests, 25,000 runs) and Yurdakul and Naranjo Table 4 (PSI, 10,000 runs). Points on the diagonal agree; hollow circles are the two cells that do not reproduce.</desc>

