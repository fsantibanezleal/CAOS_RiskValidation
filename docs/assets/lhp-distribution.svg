<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d">
  <title id="t">The large homogeneous portfolio: tail of the default fraction and its 99.9% quantile</title>
  <desc id="d">Probability that the default fraction of an infinitely granular portfolio with PD 1% exceeds a level, for asset correlations 4%, 12% and 24%, on a log scale. Each curve crosses the one-in-a-thousand line at its 99.9% quantile, the conditional PD the IRB formula charges.</desc>

