  <line class="l1" x1="436.0" x2="436.0" y1="136.2" y2="150.1" stroke-width="3"/>
  <circle class="p1" cx="436.0" cy="142.4" r="4.5"/>
  <line class="l1" x1="540.0" x2="540.0" y1="98.2" y2="103.0" stroke-width="3"/>
  <circle class="p1" cx="540.0" cy="100.4" r="4.5"/>
  <line class="l2" x1="148.0" x2="148.0" y1="229.9" y2="265.9" stroke-width="3"/>
  <circle class="p2" cx="148.0" cy="246.3" r="4.5"/>
  <line class="l2" x1="252.0" x2="252.0" y1="186.2" y2="226.8" stroke-width="3"/>
  <circle class="p2" cx="252.0" cy="203.1" r="4.5"/>
  <line class="l2" x1="356.0" x2="356.0" y1="167.7" y2="190.9" stroke-width="3"/>
  <circle class="p2" cx="356.0" cy="178.3" r="4.5"/>
  <line class="l2" x1="460.0" x2="460.0" y1="138.1" y2="148.0" stroke-width="3"/>
  <circle class="p2" cx="460.0" cy="142.6" r="4.5"/>
  <line class="l2" x1="564.0" x2="564.0" y1="98.3" y2="102.9" stroke-width="3"/>
  <circle class="p2" cx="564.0" cy="100.4" r="4.5"/>
  <line class="l0" x1="84" x2="112" y1="440" y2="440"/>
  <text class="s" x="118" y="444">true PD</text>
  <circle class="p1" cx="228" cy="440" r="3"/>
  <text class="s" x="248" y="444">cohort: median, 5% to 95%</text>
  <circle class="p2" cx="458" cy="440" r="3"/>
  <text class="s" x="478" y="444">duration: median, 5% to 95%</text>
