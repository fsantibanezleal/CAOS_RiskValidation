<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
  <title id="t">Cohort against duration PDs by grade on a known generator</title>
  <desc id="d">One-year PD by grade estimated from 1,000 simulated years of 1,000 obligors per grade: the median and the 5% to 95% range of the cohort and duration estimates against the true PD (log scale), and the share of years in which each estimate is exactly zero.</desc>

  <style>
    .bg { fill: #f8fafc; stroke: #cbd5e1; }
    .pn { fill: #ffffff; stroke: #94a3b8; }
    .ax { stroke: #334155; stroke-width: 1.2; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .t { font: 600 14px system-ui, sans-serif; fill: #0f172a; }
    .s { font: 12px system-ui, sans-serif; fill: #334155; }
    .k { font: 11px system-ui, sans-serif; fill: #475569; }
    .l0, .l1, .l2, .l3, .l4 { fill: none; stroke-width: 2.2; }
    .l0 { stroke: #0f172a; }
    .l1 { stroke: #4338ca; } .l2 { stroke: #0f766e; } .l3 { stroke: #c2410c; } .l4 { stroke: #7c3aed; }
    .dash { stroke-dasharray: 7 4; }
    .p0 { fill: #0f172a; } .p1 { fill: #4338ca; } .p2 { fill: #0f766e; } .p3 { fill: #c2410c; } .p4 { fill: #7c3aed; }
    .hollow { fill: none; stroke: #0f172a; stroke-width: 1.4; }
    .ref { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .pn { fill: #161b22; stroke: #30363d; }
      .ax { stroke: #8b949e; }
      .grid { stroke: #21262d; }
      .t, .s { fill: #c9d1d9; }
      .k { fill: #8b949e; }
      .l0 { stroke: #c9d1d9; }
      .l1 { stroke: #58a6ff; } .l2 { stroke: #3fb950; } .l3 { stroke: #d29922; } .l4 { stroke: #bc8cff; }
      .p0 { fill: #c9d1d9; } .p1 { fill: #58a6ff; } .p2 { fill: #3fb950; } .p3 { fill: #d29922; } .p4 { fill: #bc8cff; }
      .hollow { stroke: #c9d1d9; }
      .ref { stroke: #8b949e; }
    }
  </style>
  <rect class="bg" x="1" y="1" width="998" height="468" rx="10"/>
  <text class="t" x="24" y="28">One-year PD by grade, 1,000 obligors per grade, 1,000 simulated years (generator known)</text>
  <rect class="pn" x="84" y="64" width="520" height="300"/>
  <line class="ref" x1="84" x2="604" y1="386" y2="386"/>
  <text class="k" x="78" y="390" text-anchor="end">0</text>
  <line class="grid" x1="84" x2="604" y1="364.0" y2="364.0"/>
  <text class="k" x="78" y="368.0" text-anchor="end">0.01bp</text>
  <line class="grid" x1="84" x2="604" y1="314.0" y2="314.0"/>
  <text class="k" x="78" y="318.0" text-anchor="end">0.1bp</text>
  <line class="grid" x1="84" x2="604" y1="264.0" y2="264.0"/>
