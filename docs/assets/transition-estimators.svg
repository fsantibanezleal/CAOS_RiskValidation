  <text class="s" x="680" y="54">share of years with a zero PD estimate</text>
  <text class="k" x="952" y="82" text-anchor="end">the duration estimate is never zero</text>
  <line class="grid" x1="680" x2="960" y1="364.0" y2="364.0"/>
  <text class="k" x="674" y="368.0" text-anchor="end">0%</text>
  <line class="grid" x1="680" x2="960" y1="289.0" y2="289.0"/>
  <text class="k" x="674" y="293.0" text-anchor="end">25%</text>
  <line class="grid" x1="680" x2="960" y1="214.0" y2="214.0"/>
  <text class="k" x="674" y="218.0" text-anchor="end">50%</text>
  <line class="grid" x1="680" x2="960" y1="139.0" y2="139.0"/>
  <text class="k" x="674" y="143.0" text-anchor="end">75%</text>
  <line class="grid" x1="680" x2="960" y1="64.0" y2="64.0"/>
  <text class="k" x="674" y="68.0" text-anchor="end">100%</text>
  <rect class="p1" x="690.0" y="130.3" width="16.0" height="233.7"/>
  <text class="k" x="699.0" y="126.3" text-anchor="middle">78%</text>
  <rect class="p2" x="708.0" y="364.0" width="16.0" height="0.0"/>
  <text class="k" x="708.0" y="382" text-anchor="middle">grade 1</text>
  <rect class="p1" x="746.0" y="307.3" width="16.0" height="56.7"/>
  <text class="k" x="755.0" y="303.3" text-anchor="middle">19%</text>
  <rect class="p2" x="764.0" y="364.0" width="16.0" height="0.0"/>
  <text class="k" x="764.0" y="382" text-anchor="middle">grade 2</text>
  <rect class="p1" x="802.0" y="361.9" width="16.0" height="2.1"/>
