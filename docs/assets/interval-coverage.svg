<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
  <title id="t">Exact coverage of three 95% intervals for a PD</title>
  <desc id="d">Coverage probability, computed exactly by enumerating the binomial, of the Wald, Agresti-Coull and Jeffreys 95% intervals for a grade of 200 obligors, against the true PD from 0.1% to 6%.</desc>

