  <title id="t">Most prudent PD bounds for a zero-default portfolio, and the published values</title>
  <desc id="d">Upper confidence bounds for the PD of grades A, B and C (100, 400 and 300 obligors, no defaults) against the confidence level, under independence and under asset correlation 12%, computed by riskvalidation; the dots are the values printed by Pluto and Tasche.</desc>

