  <text class="k" x="330.0" y="534" text-anchor="middle">0%</text>
  <line class="grid" x1="403.8" x2="403.8" y1="56" y2="516"/>
  <text class="k" x="403.8" y="534" text-anchor="middle">2%</text>
  <line class="grid" x1="477.7" x2="477.7" y1="56" y2="516"/>
  <text class="k" x="477.7" y="534" text-anchor="middle">4%</text>
  <line class="grid" x1="551.5" x2="551.5" y1="56" y2="516"/>
