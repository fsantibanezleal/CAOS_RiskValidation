<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" role="img" aria-labelledby="t d">
  <title id="t">PD curve calibration on the S&amp;P corporate data of Tasche (2013)</title>
  <desc id="d">Top: the 2009 grade default rates and the PD curve smoothed by quasi moment matching, which reproduces Table 5 of Tasche (2013). Bottom: the 2010 default rates and the four forecasts of section 4.2 from the 2009 model at the observed 2010 default rate, which reproduce Table 7. Grades without a default are drawn as rings on the floor of the log scale.</desc>

