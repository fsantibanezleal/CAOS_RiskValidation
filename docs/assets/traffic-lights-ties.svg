  <line class="grid" x1="444.8" x2="444.8" y1="48" y2="364"/>
  <text class="k" x="444.8" y="382" text-anchor="middle">0.5%</text>
  <line class="grid" x1="540.0" x2="540.0" y1="48" y2="364"/>
  <text class="k" x="540.0" y="382" text-anchor="middle">0.1%</text>
  <line class="ax" x1="64" x2="540" y1="364" y2="364"/>
  <line class="ax" x1="64" x2="64" y1="48" y2="364"/>
  <text class="s" x="302" y="406" text-anchor="middle">nominal level</text>
  <polyline class="ref" points="64.0,153.3 159.2,258.7 254.4,311.3 349.6,342.9 444.8,353.5 540.0,361.9"/>
  <polyline class="l1 dash" points="64.0,288.1 159.2,320.5 254.4,353.6 349.6,357.8 444.8,359.9 540.0,362.3"/>
  <line class="l1 dash" x1="556" x2="584" y1="70" y2="70"/>
  <text class="s" x="590" y="74">I_SC, ties=lower</text>
  <polyline class="l1" points="64.0,81.7 159.2,187.2 254.4,274.0 349.6,338.4 444.8,350.0 540.0,360.6"/>
  <line class="l1" x1="556" x2="584" y1="94" y2="94"/>
  <text class="s" x="590" y="98">I_SC, ties=upper</text>
  <circle class="p1" cx="64.0" cy="79.6" r="4"/>
  <circle class="p1" cx="159.2" cy="184.9" r="4"/>
  <circle class="p1" cx="254.4" cy="273.4" r="4"/>
  <circle class="p1" cx="349.6" cy="340.8" r="4"/>
  <circle class="p1" cx="444.8" cy="349.3" r="4"/>
  <circle class="p1" cx="540.0" cy="361.9" r="4"/>
  <polyline class="l2 dash" points="64.0,223.0 159.2,284.2 254.4,332.4 349.6,348.5 444.8,356.7 540.0,361.8"/>
  <line class="l2 dash" x1="556" x2="584" y1="118" y2="118"/>
  <text class="s" x="590" y="122">I_LC, ties=lower</text>
  <polyline class="l2" points="64.0,153.5 159.2,237.0 254.4,303.8 349.6,340.1 444.8,353.8 540.0,361.3"/>
  <line class="l2" x1="556" x2="584" y1="142" y2="142"/>
  <text class="s" x="590" y="146">I_LC, ties=upper</text>
  <circle class="p2" cx="64.0" cy="144.9" r="4"/>
  <circle class="p2" cx="159.2" cy="233.4" r="4"/>
  <circle class="p2" cx="254.4" cy="300.8" r="4"/>
  <circle class="p2" cx="349.6" cy="336.6" r="4"/>
  <circle class="p2" cx="444.8" cy="353.5" r="4"/>
  <circle class="p2" cx="540.0" cy="361.9" r="4"/>
  <circle class="p0" cx="570" cy="166" r="3"/>
  <text class="s" x="590" y="170">WP14 Table 7, printed</text>
  <line class="ref" x1="556" x2="584" y1="190" y2="190"/>
  <text class="s" x="590" y="194">nominal level</text>
</svg>
