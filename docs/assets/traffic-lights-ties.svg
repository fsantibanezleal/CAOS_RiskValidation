<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
  <title id="t">The traffic-lights test: printed tie rule and WP14's simulation</title>
  <desc id="d">Exact size of the traffic-lights test with independent years for WP14's scenarios I_SC (PD 0.3%) and I_LC (PD 3%) under the printed tie rule and the upper-colour rule, against WP14 Table 7.</desc>

  <style>
    .bg { fill: #f8fafc; stroke: #cbd5e1; }
    .pn { fill: #ffffff; stroke: #94a3b8; }
    .ax { stroke: #334155; stroke-width: 1.2; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .t { font: 600 14px system-ui, sans-serif; fill: #0f172a; }
    .s { font: 12px system-ui, sans-serif; fill: #334155; }
    .k { font: 11px system-ui, sans-serif; fill: #475569; }
    .l0, .l1, .l2, .l3, .l4 { fill: none; stroke-width: 2.2; }
    .l0 { stroke: #0f172a; }
    .l1 { stroke: #4338ca; } .l2 { stroke: #0f766e; } .l3 { stroke: #c2410c; } .l4 { stroke: #7c3aed; }
    .dash { stroke-dasharray: 7 4; }
    .p0 { fill: #0f172a; } .p1 { fill: #4338ca; } .p2 { fill: #0f766e; } .p3 { fill: #c2410c; } .p4 { fill: #7c3aed; }
    .hollow { fill: none; stroke: #0f172a; stroke-width: 1.4; }
    .ref { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .pn { fill: #161b22; stroke: #30363d; }
      .ax { stroke: #8b949e; }
      .grid { stroke: #21262d; }
      .t, .s { fill: #c9d1d9; }
      .k { fill: #8b949e; }
      .l0 { stroke: #c9d1d9; }
      .l1 { stroke: #58a6ff; } .l2 { stroke: #3fb950; } .l3 { stroke: #d29922; } .l4 { stroke: #bc8cff; }
      .p0 { fill: #c9d1d9; } .p1 { fill: #58a6ff; } .p2 { fill: #3fb950; } .p3 { fill: #d29922; } .p4 { fill: #bc8cff; }
      .hollow { stroke: #c9d1d9; }
      .ref { stroke: #8b949e; }
    }
  </style>
  <rect class="bg" x="1" y="1" width="798" height="418" rx="10"/>
  <text class="t" x="64" y="28">Traffic lights, five independent years of 1,000 obligors: exact size</text>
  <line class="grid" x1="64" x2="540" y1="364.0" y2="364.0"/>
  <text class="k" x="56" y="368.0" text-anchor="end">0%</text>
  <line class="grid" x1="64" x2="540" y1="258.7" y2="258.7"/>
  <text class="k" x="56" y="262.7" text-anchor="end">5%</text>
  <line class="grid" x1="64" x2="540" y1="153.3" y2="153.3"/>
  <text class="k" x="56" y="157.3" text-anchor="end">10%</text>
  <line class="grid" x1="64" x2="540" y1="48.0" y2="48.0"/>
  <text class="k" x="56" y="52.0" text-anchor="end">15%</text>
  <line class="grid" x1="64.0" x2="64.0" y1="48" y2="364"/>
  <text class="k" x="64.0" y="382" text-anchor="middle">10%</text>
  <line class="grid" x1="159.2" x2="159.2" y1="48" y2="364"/>
  <text class="k" x="159.2" y="382" text-anchor="middle">5%</text>
  <line class="grid" x1="254.4" x2="254.4" y1="48" y2="364"/>
  <text class="k" x="254.4" y="382" text-anchor="middle">2.5%</text>
  <line class="grid" x1="349.6" x2="349.6" y1="48" y2="364"/>
