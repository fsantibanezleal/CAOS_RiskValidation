# riskvalidation: validation tests, regulatory calculators and reference engines for financial risk models.
# Distribution name == import name (`riskvalidation`), verified free on PyPI 2026-10-04 (ADR-0061).
# The core depends on NumPy and SciPy only, so it runs in the browser under Pyodide.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "riskvalidation"
# PEP 440 form of the display version X.XX.XXX in VERSION (see CHANGELOG.md and riskvalidation.__version__).
version = "0.7.0"
description = "Validation tests, regulatory calculators and reference engines for financial risk models: the toolkit of an independent model validator."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Felipe Santibáñez-Leal" }]
keywords = [
    "model-validation", "model-risk-management", "credit-risk", "market-risk", "basel", "ifrs9",
    "probability-of-default", "backtesting", "irrbb", "liquidity-risk", "operational-risk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6,<0.17", "build>=1.2", "pypdf>=4"]
# U8 market: arch (GARCH family, the Model Confidence Set) is optional; its own bounds (numpy<3,>=1.22.3, scipy>=1.8, Python >=3.10) sit
# inside the engine pins above, and it brings pandas and statsmodels, which the engine core never imports.
market = ["arch>=8.0,<9"]
# U14 ml: fairlearn and MAPIE reconcile the fairness metrics and the split-conformal quantile, in the tests only (U14 sizing Q11);
# the engine core never imports them.
ml = ["fairlearn>=0.15,<0.16", "mapie>=1.5,<2"]
# U13 stress: statsmodels is the independent reference of the VAR and the growth-at-risk regressions, in the tests only (U13 sizing R2).
stress = ["statsmodels>=0.15,<0.16"]

[project.urls]
Homepage = "https://github.com/fsantibanezleal/CAOS_RiskValidation"
Repository = "https://github.com/fsantibanezleal/CAOS_RiskValidation"
Changelog = "https://github.com/fsantibanezleal/CAOS_RiskValidation/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riskvalidation = ["policies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "sizepower: a size and power study at 4,000 repetitions or more; deselected in CI, run locally as the release gate (ADR-0074, U14 decision G7)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Shared guard copied verbatim from the product line (OreFlow's check_sdd.py); kept identical across repos.
"scripts/check_sdd.py" = ["E501"]
